name: Scrape Jobs & Deploy to Cloudflare Pages

on:
  schedule:
    # Runs automatically every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  scrape_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Multi-Platform Job Automation Engine
        run: |
          python main.py

      - name: Commit & Push Updated Seen Jobs History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json seen_jobs.txt reports/ dist/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update seen jobs & web report [skip ci]" && git push)

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'aso-job-finder'
          directory: 'dist'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
